# Check secrets: every secret this repo's workflows use, tried for real, by hand from any branch that has the CI scripts.
# The tokens are used as the workflows use them - the toolkit fetched, Bitbucket and GitHub read, then a dry-run push for the ones that push - the sealed archive is fetched and opened for every purpose in secrets.json, and each file it delivers is opened: a keystore or certificate with its password, a deploy config by logging in to its server.
# Nothing changes anywhere: no commit, no tag, no upload; a dry-run push sends nothing, and on a server only test -d runs. The summary names each secret and what was found.
# The same file in every repo that has the toolkit: the switches that keep it from asking come from env.prefix in ikaika_scripts.env.
name: Check secrets

on:
  workflow_dispatch:
    inputs:
      connect:
        description: Also log in to each deploy server over SSH with the deploy key and look for its folder (read-only)
        type: boolean
        default: true
      sync_bitbucket:
        description: Sync GitHub from Bitbucket first and check what Bitbucket has - which tries BITBUCKET_REPO_TOKEN and GH_MIRROR_TOKEN as a run does
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: secrets-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ format('Check every secret{0}', inputs.connect && ', and log in to the servers' || '') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      # Git fails rather than asks for a credential it was not given; nobody is there to answer.
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Find the CI scripts
        run: |
          if (-not (Test-Path ./.ikaika_scripts_configs/ci-check-secrets.ps1)) {
            Write-Output "::error title=No CI scripts on $env:GITHUB_REF_NAME::Pick a branch that has .ikaika_scripts_configs/ci-check-secrets.ps1 under 'Use workflow from'."
            exit 1
          }
          $prefix = (Select-String -LiteralPath ikaika_scripts.env -Pattern '^env\.prefix=(.+)$').Matches[0].Groups[1].Value.Trim()
          foreach ($switch in 'NO_PROMPT', 'NO_GUI', 'NO_UPDATE') { Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($prefix)_SCRIPTS_$switch=1" }

      # A failure here is a finding, not the end: the check below names which token it was.
      - name: Sync GitHub from Bitbucket, then check out what Bitbucket has
        id: sync
        if: inputs.sync_bitbucket
        continue-on-error: true
        env:
          BITBUCKET_REPO_TOKEN: ${{ secrets.BITBUCKET_REPO_TOKEN }}
          BITBUCKET_REPO_USER: ${{ secrets.BITBUCKET_REPO_USER }}
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./.ikaika_scripts_configs/sync-from-bitbucket.ps1

      # Everything after needs the toolkit, so a token that cannot fetch it ends the run here, named.
      - name: Fetch the toolkit (decoupled-script) with TOOLKIT_BITBUCKET_TOKEN
        env:
          TOOLKIT_BITBUCKET_TOKEN: ${{ secrets.TOOLKIT_BITBUCKET_TOKEN }}
          TOOLKIT_BITBUCKET_USER: ${{ secrets.TOOLKIT_BITBUCKET_USER }}
        run: ./.ikaika_scripts_configs/fetch-toolkit.ps1

      # Every purpose secrets.json lists, from the sealed archive, as each Build release step would take it; what it exports reaches the check below.
      - name: Open the sealed archive and set up every purpose's secrets
        id: install
        continue-on-error: true
        env:
          SHARED_FILES_URL: ${{ secrets.SHARED_FILES_URL }}
          SHARED_FILES_PASSWORD: ${{ secrets.SHARED_FILES_PASSWORD }}
        run: |
          $purposes = @((Get-Content -LiteralPath .ikaika_scripts_configs/secrets.json -Raw | ConvertFrom-Json).purposes.PSObject.Properties.Name)
          $failed = @()
          foreach ($purpose in $purposes) {
            ./script.ps1 secrets -For $purpose -Ci
            if ($LASTEXITCODE -ne 0) { $failed += $purpose }
          }
          if ($failed.Count) {
            Write-Output "::error title=Not every purpose set up::secrets -Ci failed for $($failed -join ', ') - see each one's lines above."
            exit 1
          }

      - name: Try each secret
        env:
          CONNECT: ${{ inputs.connect }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TOOLKIT_BITBUCKET_TOKEN: ${{ secrets.TOOLKIT_BITBUCKET_TOKEN }}
          TOOLKIT_BITBUCKET_USER: ${{ secrets.TOOLKIT_BITBUCKET_USER }}
          BITBUCKET_REPO_TOKEN: ${{ secrets.BITBUCKET_REPO_TOKEN }}
          BITBUCKET_REPO_USER: ${{ secrets.BITBUCKET_REPO_USER }}
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          SHARED_FILES_URL: ${{ secrets.SHARED_FILES_URL }}
          SHARED_FILES_PASSWORD: ${{ secrets.SHARED_FILES_PASSWORD }}
        run: |
          if ($env:CONNECT -eq 'true') { ./.ikaika_scripts_configs/ci-check-secrets.ps1 -Connect } else { ./.ikaika_scripts_configs/ci-check-secrets.ps1 }
          exit $LASTEXITCODE
